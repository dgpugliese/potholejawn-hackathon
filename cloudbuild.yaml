# Cloud Build pipeline: test, build the image, push to Artifact Registry, and
# roll it out to Cloud Run. Runs on every push to main once the trigger in
# docs/deploy.md is connected, or by hand with:
#   gcloud builds submit --config cloudbuild.yaml .
#
# The Anthropic key never appears here: Cloud Run reads it from Secret Manager
# (secret "anthropic-api-key") at container start.
substitutions:
  _REGION: us-east4
  _SERVICE: potholejawn
  _REPO: cloud-run-source-deploy

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet -r requirements.txt && python -m pytest -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --concurrency=16
      - --timeout=300
      - --min-instances=0
      - --max-instances=3
      - --cpu-boost
      - --update-secrets=ANTHROPIC_API_KEY=anthropic-api-key:latest
      - --set-env-vars=RATE_MAX_PER_IP=6,RATE_WINDOW_SECONDS=300,RATE_MAX_PER_HOUR=60,RATE_MAX_CONCURRENT=3
      - --labels=app=potholejawn,managed-by=cloudbuild

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
